<svg xmlns="http://www.w3.org/2000/svg" width="720" height="520" viewBox="0 0 720 520">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b5fff" stop-opacity=".18"/>
      <stop offset="1" stop-color="#00b3ff" stop-opacity=".10"/>
    </linearGradient>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b5fff"/>
      <stop offset="1" stop-color="#00b3ff"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="720" height="520" rx="28" fill="url(#bg)"/>

  <!-- laptop -->
  <rect x="140" y="120" width="440" height="270" rx="22" fill="#ffffff" opacity=".92"/>
  <rect x="160" y="140" width="400" height="230" rx="16" fill="#0b1220" opacity=".95"/>
  <rect x="110" y="392" width="500" height="28" rx="14" fill="#ffffff" opacity=".92"/>

  <!-- big optotype letter -->
  <text x="360" y="300" text-anchor="middle" font-size="170" font-family="Inter, Arial, sans-serif" font-weight="800" fill="#ffffff">E</text>

  <!-- badges -->
  <g transform="translate(170 165)">
    <rect width="160" height="44" rx="22" fill="url(#g)" opacity=".95"/>
    <text x="80" y="29" text-anchor="middle" font-size="16" font-family="Inter, Arial, sans-serif" font-weight="700" fill="#ffffff">Screening</text>
  </g>

  <g transform="translate(390 165)">
    <rect width="170" height="44" rx="22" fill="#ffffff" opacity=".92"/>
    <text x="85" y="29" text-anchor="middle" font-size="16" font-family="Inter, Arial, sans-serif" font-weight="700" fill="#0b1220">Not diagnosis</text>
  </g>

  <!-- subtle eye icon -->
  <g transform="translate(318 62)">
    <rect width="84" height="84" rx="22" fill="url(#g)" opacity=".95"/>
    <path d="M42 28c-11.5 0-21.3 8.2-25 16c3.7 7.8 13.5 16 25 16s21.3-8.2 25-16c-3.7-7.8-13.5-16-25-16Z" fill="#fff" opacity=".95"/>
    <circle cx="42" cy="44" r="10" fill="#0b1220" opacity=".9"/>
  </g>
</svg>
